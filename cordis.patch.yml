# @gxx-labs/mcp-ui-dsh 的 bundle patch：本包自带的 Loader 行。
#
# package.json 的 `dsh.bundle.patch` 指向本文件，使插件可被 DSH 的
# 「添加插件 / plugin_manager install_bundle」正式安装——没有这一声明，
# 安装器会以 `not-a-bundle`（"<name> declares no dsh.bundle"）拒绝。
#
# 行名必须是**裸包名**：dsh-client-modules 的 locatePkgJson() 只认精确包名，
# 写成子路径会让 locatePkgJson 返回 undefined，浏览器半就不会被注册进
# __DSH_BOOT__，设置页签不会出现。
#
# 本行同时挂载两个半边：
#   - 宿主半  lib/index.js   → webServer 路由 /api/mcp-ui/*
#   - 浏览器半 dist/client.js → settings.section 槽位（设置页签）
#
# 注意：MCP 服务**不在这里**以静态行声明——它们由本插件在运行时写入
# 用户 profile 的 cordis.patch.yml（`insert:` 列表），再经 Loader 热重载
# 即时生效。静态声明只用于本插件自身的挂载。
- insert:
    - id: '@gxx-labs/mcp-ui-dsh'
      name: '@gxx-labs/mcp-ui-dsh'
